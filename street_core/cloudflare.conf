# ========================================
# STREETCORE FRONTEND - Cloudflare Config
# ========================================
# Configuración optimizada para CDN de Cloudflare
# ========================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ========================================
    # SECURITY HEADERS
    # ========================================
    # X-Frame-Options: Previene clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # X-Content-Type-Options: Previene MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection: Protección XSS legacy
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer-Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy (ajustar según necesidades)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api-beta.streetcore.com wss://api-beta.streetcore.com; frame-ancestors 'self';" always;

    # ========================================
    # CLOUDFLARE CACHE HEADERS
    # ========================================
    # Cache-Control para recursos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        access_log off;
    }

    # HTML no cacheable (siempre servir último)
    location ~* \.(html|htm)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # ========================================
    # CLOUDFLARE ORIGIN HEADERS
    # ========================================
    # Identificar origen para Cloudflare
    add_header X-Origin-Server "StreetCore-Beta-Nginx" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ========================================
    # FLUTTER WEB ROUTING
    # ========================================
    # Manejo de rutas de Flutter (SPA)
    location / {
        try_files $uri $uri/ /index.html;

        # Headers para HTML
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ========================================
    # VERSION ENDPOINT (para cache busting)
    # ========================================
    location /version.txt {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type text/plain;
    }

    # ========================================
    # HEALTH CHECK
    # ========================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ========================================
    # API PROXY (opcional, si backend en mismo dominio)
    # ========================================
    # Descomentar si quieres proxear API a través de Nginx
    # location /api/ {
    #     proxy_pass http://backend:3000/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # ========================================
    # ERROR PAGES
    # ========================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
