name: street_core
description: "aplicacion deportiva"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.0.1
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  get_it: ^9.2.0
  http: ^1.6.0
  http_parser: ^4.1.2
  equatable: ^2.0.7
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  web: ^1.1.1
  timeago: ^3.7.1
  carousel_slider: ^5.1.1
  share_plus: ^12.0.1
  intl: ^0.20.2
  package_info_plus: ^8.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.2

  # Live streaming
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8

  # Real-time chat & reactions
  socket_io_client: ^3.0.0

  # Server-Sent Events (SSE) for Speaker Dashboard
  eventsource: any
  flutter_client_sse: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

dependency_overrides:
  http: ^1.6.0
